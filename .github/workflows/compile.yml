name: Generate Xcode Project & Build iOS (IPA)

on:
  push:
    branches: [ "legacy" ]
  workflow_dispatch:

jobs:
  xcode-ios-build:
    name: Xcode Project Generation and Build
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install Build Prerequisites
      run: |
        brew update
        brew install make pkg-config sdl2 jsoncpp coreutils

    - name: Generate Xcode Project and Files
      run: |
        # 1. Provide the mandatory base game assets for compilation
        mkdir -p build
        touch baserom.us.z64
        
        # 2. Run the platform configuration script to generate the .xcodeproj context
        if [ -f "./build_ios.sh" ]; then
          chmod +x ./build_ios.sh
          ./build_ios.sh
        else
          # Fallback generation rule using the Makefile engine to construct build headers
          make TARGET_IOS=1 TARGET_APPLE=1 xcode
        fi

    - name: Build with xcodebuild
      run: |
        # Dynamically locate the generated .xcworkspace or .xcodeproj structure
        XCODE_PATH=$(find . -name "*.xcworkspace" -o -name "*.xcodeproj" | head -n 1)
        
        if [ -z "$XCODE_PATH" ]; then
          echo "Error: Failed to auto-generate or find an Xcode project template."
          exit 1
        fi
        echo "Compiling generated architecture at: $XCODE_PATH"

        # Determine type parameters flags
        if [[ "$XCODE_PATH" == *".xcworkspace"* ]]; then
          BUILD_FLAG="-workspace $XCODE_PATH"
        else
          BUILD_FLAG="-project $XCODE_PATH"
        fi

        # Build application target context (ImGui layout, virtual pads, widgets)
        xcodebuild $BUILD_FLAG \
                   -scheme "saturn" \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   BUILD_DIR=build \
                   clean build

    - name: Package App to IPA
      run: |
        mkdir -p Payload
        
        # Locate the compiled bundle produced inside the configuration directory
        APP_BUNDLE=$(find build/ -type d -name "*.app" | head -n 1)
        
        if [ -z "$APP_BUNDLE" ]; then
          echo "Error: Output .app bundle was not built successfully."
          exit 1
        fi
        
        cp -r "$APP_BUNDLE" Payload/
        zip -r saturn.ipa Payload/

    - name: Upload Finished IPA
      uses: actions/upload-artifact@v4
      with:
        name: saturn-xcode-iOS-legacy
        path: saturn.ipa
