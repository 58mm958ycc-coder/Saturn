name: Custom Python Discovery & Xcode iOS Build (IPA)

on:
  push:
    branches: [ "legacy" ]
  workflow_dispatch:

jobs:
  xcode-ios-build:
    name: Source Discovery and Xcode Build
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install Build Prerequisites
      run: |
        brew update
        brew install make pkg-config sdl2 jsoncpp coreutils

    - name: Inject Core Dependencies and Assets
      run: |
        # 1. Spawn primary compilation target tree folders
        mkdir -p build/us_pc build/us_ios
        
        # 2. Inject compilation dependencies placeholder structures
        echo "Mock Rom Content" > baserom.us.z64
        echo "Mock DLL Content" > discord_sdk.dll
        echo "Base assets injected successfully."

    - name: Run Python Factory & Source Discovery Scanner
      run: |
        # Executes your text file generation, extension renaming, and verification scanning
        if [ -f "./cpp_c_h_finder.py" ]; then
          python3 ./cpp_c_h_finder.py
        else
          echo "Error: cpp_c_h_finder.py script not discovered in root directory!"
          exit 1
        fi

    - name: Patch Makefiles for Apple Preprocessor
      run: |
        # Resolves structural -I . flag parsing conflicts unique to macOS Clang compilers
        find . -name "Makefile*" -type f -exec sed -i '' 's/-I \./-I\./g' {} +
        find . -name "*.split" -type f -exec sed -i '' 's/-I \./-I\./g' {} +

    - name: Generate Xcode Project Files
      run: |
        export CPP="clang -E -x c"
        export CFLAGS="-I/opt/homebrew/include -I/opt/homebrew/include/SDL2"
        export LDFLAGS="-L/opt/homebrew/lib"
        
        if [ -f "./build_ios.sh" ]; then
          chmod +x ./build_ios.sh
          CPP="clang -E -x c" CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" ./build_ios.sh
        else
          make TARGET_IOS=1 TARGET_APPLE=1 CPP="clang -E -x c" CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" xcode || \
          make TARGET_IOS=1 TARGET_APPLE=1 CPP="clang -E -x c" CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"
        fi

    - name: Build with xcodebuild
      run: |
        XCODE_PATH=$(find . -name "*.xcworkspace" -o -name "*.xcodeproj" | head -n 1)
        
        if [ -z "$XCODE_PATH" ]; then
          echo "Error: Failed to auto-generate or find an Xcode project template."
          exit 1
        fi
        echo "Compiling generated architecture at: $XCODE_PATH"

        if [[ "$XCODE_PATH" == *".xcworkspace"* ]]; then
          BUILD_FLAG="-workspace $XCODE_PATH"
        else
          BUILD_FLAG="-project $XCODE_PATH"
        fi

        xcodebuild $BUILD_FLAG \
                   -scheme "saturn" \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   HEADER_SEARCH_PATHS="/opt/homebrew/include /opt/homebrew/include/SDL2" \
                   LIBRARY_SEARCH_PATHS="/opt/homebrew/lib" \
                   BUILD_DIR=build \
                   clean build

    - name: Package App to IPA
      run: |
        mkdir -p Payload
        APP_BUNDLE=$(find build/ -type d -name "*.app" | head -n 1)
        
        if [ -z "$APP_BUNDLE" ]; then
          echo "Error: Output .app bundle was not built successfully."
          exit 1
        fi
        
        cp -r "$APP_BUNDLE" Payload/
        zip -r saturn.ipa Payload/

    - name: Upload Finished IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: saturn-xcode-iOS-legacy
        path: saturn.ipa
