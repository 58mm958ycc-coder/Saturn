name: Auto-Compile iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Homebrew & Install Dependencies
        run: |
          brew install xcodegen sdl2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Auto-Validator & Build Pipeline
        run: |
          python3 fix_and_build.py

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saturn-ipa
          path: saturn.ipa
