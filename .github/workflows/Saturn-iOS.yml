name: Saturn iOS Production Engine Compiler

on:  
  push:    
    branches: [ main, master, legacy ]  
  workflow_dispatch:

jobs:  
  build-saturn-ios-production:    
    runs-on: macos-15    
    steps:      
      - name: Checkout Repository        
        uses: actions/checkout@v4      

      - name: Select Newest Xcode Version
        run: |
          echo "=================================================="
          echo "  SELECTING LATEST XCODE VERSION                 "
          echo "=================================================="
          
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "[*] Switching developer tools to: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          else
            echo "[!] Using system default Xcode path..."
          fi
          
          xcodebuild -version

      - name: Install Apple Project Blueprint and Build Utilities        
        run: |          
          echo "[*] Initializing official Apple developer frameworks..."          
          brew install xcodegen cmake     

      - name: Build SDL2 Static Library for iOS ARM64
        run: |
          echo "=================================================="
          echo "  FETCHING & BUILDING SDL2 FOR iOS ARM64          "
          echo "=================================================="
          
          git clone --depth 1 --branch release-2.30.10 https://github.com/libsdl-org/SDL.git sdl2_src
          
          mkdir -p include_deps/SDL2
          cp -R sdl2_src/include/* include_deps/SDL2/
          
          cmake -S sdl2_src -B sdl2_build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=OFF \
            -DSDL_TEST=OFF
            
          cmake --build sdl2_build --config Release
          
          mkdir -p lib_deps
          find sdl2_build -name "*.a" -exec cp {} lib_deps/ \;
          if [ -f "lib_deps/libSDL2-static.a" ] && [ ! -f "lib_deps/libSDL2.a" ]; then
            cp lib_deps/libSDL2-static.a lib_deps/libSDL2.a
          fi
          
          echo "[✔] SDL2 compiled successfully for iOS ARM64!"

      - name: Dynamically Generate Unified Xcode Project Mapping Blueprint        
        run: |          
          echo "=================================================="          
          echo "  GENERATING XCODE PROJECT FOR C/C++ SOURCE TREE  "          
          echo "=================================================="          
          
          cat << 'EOF' > project.yml
          name: SaturnApp
          options:
            bundleIdPrefix: com.zezo
            xcodeVersion: "16.0"
          targets:
            SaturnApp:
              type: application
              platform: iOS
              deploymentTarget: "14.0"
              sources:
                - path: src
                  includes: ["**/*.c", "**/*.cpp", "**/*.cc", "**/*.cxx", "**/*.h", "**/*.hpp", "**/*.inl", "**/*.mm", "**/*.m"]
                - path: levels
                  includes: ["**/*.c", "**/*.cpp", "**/*.cc", "**/*.cxx", "**/*.h", "**/*.hpp", "**/*.inl"]
                - path: actors
                  includes: ["**/*.c", "**/*.cpp", "**/*.cc", "**/*.cxx", "**/*.h", "**/*.hpp", "**/*.inl"]
                - path: include
                  includes: ["**/*.h", "**/*.hpp"]
              settings:
                OTHER_CFLAGS: ["-DTARGET_APPLE=1", "-DION_MOBILE=1", "-DSATURN_LAUNCH_ALL_GUIS=1", "-DSHOW_DIAGNOSTICS_DASHBOARD=1", "-w"]
                HEADER_SEARCH_PATHS: [
                  "$(SRCROOT)/include_deps",
                  "$(SRCROOT)/src",
                  "$(SRCROOT)/src/saturn",
                  "$(SRCROOT)/src/saturn/imgui",
                  "$(SRCROOT)/src/saturn/libs/imgui",
                  "$(SRCROOT)/include"
                ]
                LIBRARY_SEARCH_PATHS: [
                  "$(SRCROOT)/lib_deps"
                ]
                OTHER_LDFLAGS: [
                  "-lSDL2",
                  "-framework", "AVFoundation",
                  "-framework", "AudioToolbox",
                  "-framework", "CoreGraphics",
                  "-framework", "CoreMotion",
                  "-framework", "Foundation",
                  "-framework", "GameController",
                  "-framework", "Metal",
                  "-framework", "OpenGLES",
                  "-framework", "QuartzCore",
                  "-framework", "UIKit"
                ]
                GCC_C_LANGUAGE_STANDARD: gnu11
                CLANG_CXX_LANGUAGE_STANDARD: c++17
                ENABLE_BITCODE: NO
          EOF

          xcodegen generate
          
          if [ ! -d "SaturnApp.xcodeproj" ]; then
            echo "[!] ERROR: XcodeGen failed to generate SaturnApp.xcodeproj"
            exit 1
          fi
          echo "[✔] SaturnApp.xcodeproj generated successfully!"

      - name: Compile Full Project Source Tree into Live iOS Executable        
        run: |          
          echo "=================================================="          
          echo "   COMPILING SATURN ENGINE INTO NATIVE ARM64 BINARY"          
          echo "=================================================="          
          
          xcodebuild -project SaturnApp.xcodeproj \
                     -scheme SaturnApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -arch arm64 \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build
                     
          mkdir -p build_output/MyApplication.app          
          cp -R build/Release-iphoneos/SaturnApp.app/* build_output/MyApplication.app/              
          echo "[✔] Found active production build!"          

      - name: Package Complete Game Assets into Sideloadable Bundle        
        run: |          
          echo "=================================================="          
          echo "   PACKAGING REAL ENGINE INTO RE-SIGNABLE iOS .IPA"          
          echo "=================================================="          

          rm -rf Payload MyApplication.ipa
          mkdir -p Payload/MyApplication.app
          
          cp -R build_output/MyApplication.app/* Payload/MyApplication.app/
          
          if [ -d "dynos" ]; then
              cp -R dynos Payload/MyApplication.app/dynos
          fi
          if [ -d "res" ]; then
              cp -R res Payload/MyApplication.app/res
          fi
          if [ -d "levels" ]; then
              cp -R levels Payload/MyApplication.app/levels
          fi
          if [ -d "actors" ]; then
              cp -R actors Payload/MyApplication.app/actors
          fi
          
          if [ -f "Payload/MyApplication.app/SaturnApp" ]; then
              mv Payload/MyApplication.app/SaturnApp Payload/MyApplication.app/MyApplication
          fi
          chmod +x Payload/MyApplication.app/MyApplication
          
          cat << 'PLIST_EOF' > Payload/MyApplication.app/Info.plist
          
          
          
          
              CFBundleDevelopmentRegion
              en
              CFBundleExecutable
              MyApplication
              CFBundleIdentifier
              com.zezo.saturnmobile
              CFBundleInfoDictionaryVersion
              6.0
              CFBundleName
              Saturn
              CFBundlePackageType
              APPL
              CFBundleShortVersionString
              1.0
              CFBundleVersion
              1
              MinimumOSVersion
              14.0
              UIDeviceFamily
              
                  1
                  2
              
          
          
          PLIST_EOF
          
          cat << 'PY_EOF' > zip_ipa.py
          import os
          import zipfile

          ipa_name = "MyApplication.ipa"
          print(f"Creating {ipa_name}...")
          with zipfile.ZipFile(ipa_name, "w", zipfile.ZIP_DEFLATED) as zipf:
              for root, dirs, files in os.walk("Payload"):
                  for file in files:
                      file_path = os.path.join(root, file)
                      arcname = os.path.relpath(file_path, start=".")
                      zipf.write(file_path, arcname)
          print("[✔] SUCCESS // SATURN ENGINE IPA FULLY BUNDLED.")
          PY_EOF
          
          python3 zip_ipa.py

      - name: Upload Complete Sideloadable Application Bundle        
        uses: actions/upload-artifact@v4        
        with:          
          name: Saturn-Xcode-iOS-IPA          
          path: MyApplication.ipa
