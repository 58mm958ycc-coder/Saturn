name: iOS Intelligent Auto-Fix Pipeline

on:
  push:
    branches: [ "legacy", "main" ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Auto-Patch, Validate, and Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Active Xcode Version
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install System Prerequisites
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        shell: bash
        run: |
          brew install make pkg-config coreutils xcodegen zip python-tk

      - name: Step 1 - Execute Smart Validator & Auto-Patcher
        shell: bash
        run: python3 smart_validator.py

      - name: Step 2 - Execute Environment Setup & Xcode Builder
        shell: bash
        run: python3 fix_and_build.py

      - name: Step 3 - Package Output Artifacts
        shell: bash
        run: |
          python3 -c "
          import os, shutil, zipfile
          app_path = 'build/Release-iphoneos/saturn.app'
          os.makedirs('Payload', exist_ok=True)
          if os.path.exists(app_path):
              shutil.copytree(app_path, 'Payload/saturn.app')
          with zipfile.ZipFile('saturn.ipa', 'w', zipfile.ZIP_DEFLATED) as zipf:
              for root, _, files in os.walk('Payload'):
                  for file in files:
                      fp = os.path.join(root, file)
                      zipf.write(fp, os.path.relpath(fp, '.'))
          "

      - name: Upload Compiled IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saturn-ios-ipa
          path: saturn.ipa
