name: iOS Intelligent Auto-Fix Pipeline

on:
  push:
    branches: [ "legacy", "main" ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Auto-Patch, Validate, and Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Active Xcode Version
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install System Prerequisites
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        shell: bash
        # Added sdl2 and glew for the native macOS generator step
        run: |
          brew install make pkg-config coreutils xcodegen zip python-tk sdl2 glew

      - name: Step 1 - Generate Assets & DynOS Packs (Native macOS Run)
        shell: bash
        run: |
          echo "=================================================="
          echo "  PRE-GENERATING ASSETS & DYNOS (NATIVE MACOS)    "
          echo "=================================================="
          
          # Run standard make to compile tools and convert PNGs to .inc.c files
          make -j$(sysctl -n hw.ncpu) -k || echo "[WARNING] Make finished with some errors, but assets should be generated."
          
          echo "Looking for compiled native executable..."
          EXE_PATH=$(find build -name "*.app" -prune -o -type f -executable \(-name "saturn*" -o -name "sm64*"\) -print | head -n 1)
          
          if [ -n "$EXE_PATH" ]; then
              echo "Running $EXE_PATH for 8 seconds to trigger DynOS pack generation..."
              python3 -c "
          import subprocess
          import sys
          try:
              print('Launching engine in background...')
              subprocess.run(['$EXE_PATH'], timeout=8)
          except subprocess.TimeoutExpired:
              print('Engine stopped safely. DynOS generation complete.')
          except Exception as e:
              print(f'Engine crashed (expected in headless CI): {e}')
          "
          else
              echo "Could not find native executable to run. Moving on..."
          fi
          
          echo "Cleaning up macOS-specific object files to prepare for iOS build..."
          find build -name "*.o" -type f -delete
          find build -name "*.a" -type f -delete
          
          echo "Asset generation complete!"

      - name: Step 2 - Execute Smart Validator & Auto-Patcher
        shell: bash
        run: python3 smart_validator.py

      - name: Step 3 - Execute Environment Setup & Xcode Builder
        shell: bash
        run: python3 fix_and_build.py

      - name: Step 4 - Package Output Artifacts
        shell: bash
        run: |
          python3 -c "
          import os, shutil, zipfile
          app_path = 'build/Release-iphoneos/saturn.app'
          os.makedirs('Payload', exist_ok=True)
          if os.path.exists(app_path):
              shutil.copytree(app_path, 'Payload/saturn.app')
          with zipfile.ZipFile('saturn.ipa', 'w', zipfile.ZIP_DEFLATED) as zipf:
              for root, _, files in os.walk('Payload'):
                  for file in files:
                      fp = os.path.join(root, file)
                      zipf.write(fp, os.path.relpath(fp, '.'))
          "

      - name: Upload Compiled IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saturn-ios-ipa
          path: saturn.ipa
